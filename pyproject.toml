[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "sailpoint-query-ai-agent"
version = "1.0.0"
description = "Intelligent AI assistant for SailPoint identity governance products"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SailPoint Query AI Agent Team"},
]
dependencies = [
    "claude-agent-sdk>=1.0.0",
    "anthropic>=0.40.0",
    "litellm>=1.50.0",
    "click>=8.1.0",
    "rich>=13.0.0",
    "streamlit>=1.40.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0.0",
    "structlog>=24.0.0",
    "beautifulsoup4>=4.12.0",
    "html2text>=2024.2.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[project.scripts]
sailpoint-agent = "sailpoint_agent.cli.app:cli"

[tool.setuptools.packages.find]
include = ["sailpoint_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
