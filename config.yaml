llm:
  provider: "claude"
  model: "claude-sonnet-4-20250514"
  temperature: 0.1
  max_tokens: 4096
  timeout: 60

fallback_llm:
  provider: "openai"
  model: "gpt-4"
  temperature: 0.1
  max_tokens: 4096

agent:
  max_iterations: 5
  confidence_threshold: 0.85
  enable_traces: false
  search_depth: 3

search:
  sailpoint_domains:
    - "developer.sailpoint.com"
    - "documentation.sailpoint.com"
    - "community.sailpoint.com"
    - "github.com/sailpoint-oss"
  max_results_per_search: 5
  fetch_page_content: true
  fallback_to_general_web: true

log_level: "INFO"
log_format: "json"
